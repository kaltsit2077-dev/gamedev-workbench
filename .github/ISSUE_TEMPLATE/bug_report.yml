name: 缺陷与失败复现
description: 提交可复现的工具或工作流问题
body:
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: 工作台版本、系统、Python；涉及引擎时补实际引擎版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 目标、输入、命令或代理请求、实际结果与预期结果；只附可公开的脱敏文件
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与影响
      description: 退出码、失败检查、截图或最小原创工程；说明哪些部分尚未验证
