name: Toolbox checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/gdw.py validate
      - run: python tools/readme_visuals.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/evaluate_analysis.py --output analysis-ci.json
      - run: python tools/repeated_eval.py grade --artifacts evals/transactions/outputs --metadata evals/transactions/run-metadata.json --output .cache/evaluation-ci
      - run: python tools/release_audit.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python tools/package.py --output-dir dist
